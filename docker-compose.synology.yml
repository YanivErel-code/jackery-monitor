# Synology / generic Linux deployment — no profiles, just two services that
# always run. Use this file with Container Manager (DSM) which doesn't expose
# compose profiles in the UI.
#
# Build & start:
#   Container Manager > Project > Create
#     Source: Use existing docker-compose.yml
#     Path:   /docker/jackery-monitor
#     File:   docker-compose.synology.yml          <-- pick THIS one, not the default
#
# Or from the CLI on any Linux box:
#   docker compose -f docker-compose.synology.yml up -d --build

services:
  # Cloud bridge — holds Jackery credentials, polls the Jackery cloud,
  # exposes JSON-RPC on TCP 8766 (internal docker network only, NOT to the LAN).
  jackery-bridge:
    build: .
    image: jackery-monitor:latest
    container_name: jackery-bridge
    restart: unless-stopped
    command: ["python", "bridge.py"]
    environment:
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: "8766"
      CLOUD_POLL_INTERVAL_S: "15"
      # These come from the .env file next to this compose file.
      JACKERY_EMAIL: "${JACKERY_EMAIL:-}"
      JACKERY_PASSWORD: "${JACKERY_PASSWORD:-}"
      JACKERY_REGION: "${JACKERY_REGION:-US}"
      JACKERY_CREDS_FILE: /data/jackery-creds.json
    expose:
      - "8766"
    volumes:
      - jackery-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8766)); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # FastAPI dashboard — talks to the bridge over the internal docker network.
  # Published on the LAN at http://<nas-ip>:${JACKERY_HTTP_PORT}.
  jackery-monitor:
    build: .
    image: jackery-monitor:latest
    container_name: jackery-monitor
    restart: unless-stopped
    depends_on:
      jackery-bridge:
        condition: service_healthy
    ports:
      - "${JACKERY_HTTP_PORT:-8000}:8000"
    environment:
      BACKEND: bridge
      BRIDGE_URL: jackery-bridge:8766
      POLL_INTERVAL_S: "10"
      JACKERY_DB: /data/energy.db
    volumes:
      - jackery-data:/data

volumes:
  jackery-data:
