# Lint + unit tests on every push and PR. Separate from docker-publish.yml
# which only runs on main / tags.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Force any Node-20-based JS action (e.g. actions/setup-python@v5) onto
    # the runner's Node 24 ahead of GitHub's June 2026 forced switchover.
    # Silences the "running on Node.js 20 may not work as expected" warning
    # without needing a coordinated bump on every action major.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # checkout@v5 is Node-24-native; setup-python@v5 still uses Node 20
      # natively but the env var above forces it onto Node 24.
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # Format check intentionally omitted — the existing code style is
      # consistent but doesn't match ruff format exactly, and reformatting
      # everything would create a large diff unrelated to behavior. New code
      # should still be formatted; revisit running `ruff format` once when
      # we're ready to take that diff.

      - name: Tests (pytest)
        run: pytest -v --tb=short

      # Smokes are end-to-end scripts (not pytest-collected) that spin
      # up an in-process fake Jackery cloud and verify the cloud client
      # + bridge boot + handshake. Without this step bridge.py and
      # large parts of cloud_client.py have zero coverage in CI. Each
      # script exits non-zero on assertion failure.
      - name: Smoke (cloud_client)
        run: python tests/smoke_cloud.py
      - name: Smoke (bridge)
        run: python tests/smoke_bridge.py
