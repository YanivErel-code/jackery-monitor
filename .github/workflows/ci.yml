# Lint + unit tests on every push and PR. Separate from docker-publish.yml
# which only runs on main / tags.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # Format check intentionally omitted — the existing code style is
      # consistent but doesn't match ruff format exactly, and reformatting
      # everything would create a large diff unrelated to behavior. New code
      # should still be formatted; revisit running `ruff format` once when
      # we're ready to take that diff.

      - name: Tests (pytest)
        run: pytest -v --tb=short
