# Default deployment — Synology / generic Linux. Pulls the pre-built image
# from GitHub Container Registry (no local build step).
#
# Synology Container Manager workflow:
#   1. Registry tab -> search "ghcr.io/yaniverel-code/jackery-monitor" -> Download (latest)
#   2. Project -> Create -> path /docker/jackery-monitor (this folder).
#      Source: "Use existing docker-compose.yml". Container Manager will pull
#      the image and start both services. Build step is skipped.
#
# To update later: Container Manager -> Image -> right-click image ->
# "Get latest version", then Project -> jackery-monitor -> "Action -> Restart".
#
# Variants:
#   docker-compose.build.yml -> build from local Dockerfile (no registry needed).
#                               Use this if GHCR is unreachable or you want to
#                               run uncommitted code on the NAS.
#   docker-compose.dev.yml   -> macOS host-bridge / mock profiles for dev.

services:
  # Cloud bridge — holds Jackery credentials, polls the Jackery cloud,
  # exposes JSON-RPC on TCP 8766 (internal docker network only, NOT to the LAN).
  jackery-bridge:
    image: ghcr.io/yaniverel-code/jackery-monitor:latest
    pull_policy: always
    container_name: jackery-bridge
    restart: unless-stopped
    command: ["python", "bridge.py"]
    environment:
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: "8766"
      CLOUD_POLL_INTERVAL_S: "15"
      # Credentials: leave JACKERY_EMAIL/JACKERY_PASSWORD blank in .env and
      # sign in via the dashboard UI (saved encrypted to /data). Setting them
      # here pins them and disables the UI sign-in/sign-out flow.
      JACKERY_EMAIL: "${JACKERY_EMAIL:-}"
      JACKERY_PASSWORD: "${JACKERY_PASSWORD:-}"
      JACKERY_REGION: "${JACKERY_REGION:-US}"
      JACKERY_CREDS_FILE: /data/jackery-creds.json
    # Bind 8766 only to the host loopback so the host-networked
    # jackery-monitor container can reach it at 127.0.0.1:8766. Not
    # published to the LAN — nothing else should talk to the bridge.
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - jackery-data:/data
    labels:
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8766)); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # FastAPI dashboard — host networking so the backup auto-discovery
  # feature can sweep the LAN for SMB hosts (the docker bridge would
  # otherwise hide the LAN behind NAT). Reachable on the LAN at
  # http://<nas-ip>:${JACKERY_HTTP_PORT}.
  jackery-monitor:
    image: ghcr.io/yaniverel-code/jackery-monitor:latest
    pull_policy: always
    container_name: jackery-monitor
    restart: unless-stopped
    depends_on:
      jackery-bridge:
        condition: service_healthy
    # Host networking: container shares the Synology's network namespace.
    # No more ports: mapping — the app binds directly to the host's
    # JACKERY_HTTP_PORT. Required for backup_discover.py to enumerate
    # SMB hosts on the real LAN subnet (e.g. 192.168.1.0/24) instead
    # of the docker bridge subnet (172.x.0.0/16).
    network_mode: host
    environment:
      BACKEND: bridge
      # Host networking means "jackery-bridge" hostname is no longer
      # resolvable. The bridge container publishes 8766 to 127.0.0.1
      # so we reach it via loopback.
      BRIDGE_URL: 127.0.0.1:8766
      POLL_INTERVAL_S: "10"
      JACKERY_DB: /data/energy.db
      # uvicorn reads PORT from env. With host networking we bind
      # directly to JACKERY_HTTP_PORT (default 8123) on the host — no
      # docker port mapping in the way.
      PORT: "${JACKERY_HTTP_PORT:-8123}"
      # Cloudflare Access (Google SSO) edge auth. Empty defaults = inert
      # (app keeps its own password). Set these in .env to let a
      # Cloudflare-Access-authenticated request skip the app password;
      # the password stays as the LAN-direct fallback. See cf_access.py.
      #   TEAM = your <team>.cloudflareaccess.com subdomain
      #   AUD  = the Access application's Audience tag
      #   EMAILS = optional comma-separated allowlist (policy is primary)
      JACKERY_CF_ACCESS_TEAM: "${JACKERY_CF_ACCESS_TEAM:-}"
      JACKERY_CF_ACCESS_AUD: "${JACKERY_CF_ACCESS_AUD:-}"
      JACKERY_CF_ACCESS_EMAILS: "${JACKERY_CF_ACCESS_EMAILS:-}"
    volumes:
      - jackery-data:/data
    # No cap_add / security_opt anymore. The backup feature now uses
    # smbclient (pure userspace) instead of mount.cifs, so this
    # container can stay fully unprivileged. The previous SYS_ADMIN +
    # DAC_READ_SEARCH + apparmor:unconfined combo was needed to let
    # mount.cifs call the kernel mount syscall and capset() to drop
    # privileges afterwards — Synology DSM was blocking the latter
    # ("Unable to apply new capability set"), which is what motivated
    # the smbclient refactor.
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Auto-update the two services above when a new :latest image is published
  # to GHCR (by .github/workflows/docker-publish.yml on push to main).
  # Polls every 60s; only touches containers with the watchtower.enable label.
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "60"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
    command: --label-enable

volumes:
  jackery-data:
