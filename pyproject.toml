# Tooling config for the Jackery Monitor.
# - pytest config + paths
# - ruff config (lint + format on save / pre-commit)
# - mypy is intentionally NOT configured project-wide; type hints are
#   advisory in this codebase, and the FastAPI / async stack confuses
#   mypy more than it helps.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Treat the repo root as importable so tests can `import auth` etc.
# without a setup.py / src layout.
pythonpath = ["."]
# `smoke_*` are integration tests that spin up a fake server / process —
# they're slower and depend on the full dep set. Default `pytest` runs
# the unit tests; opt into smokes with `pytest -k smoke`.
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    # paho-mqtt emits a DeprecationWarning we can't fix
    "ignore::DeprecationWarning:paho.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Don't lint the diagnostic scripts — they're meant to be ad-hoc and
# their `print()` style is intentional.
extend-exclude = ["diag_*.py", "tests/smoke_*.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    # Long lines are sometimes the right call (URLs, comments)
    "E501",
    # `pass` after `try/except: pass` — common pattern, fine
    "B011",
    # `raise X from e` — useful, but for FastAPI endpoints with many
    # `except ... as e: raise HTTPException(...)` it's mostly noise.
    "B904",
    # Storing the asyncio.create_task return value — fire-and-forget
    # is intentional in our poll loops.
    "RUF006",
    # `from datetime import UTC` is py311+ only. The container runs 3.11
    # but local pytest runs whatever the dev box has (often 3.9). Stick
    # to the broadly-compatible `timezone.utc` form.
    "UP017",
    # Ambiguous unicode chars in strings/docstrings/comments. We use
    # `≤`, `≥`, `±`, `×` deliberately in domain comments (forecaster
    # math, capacity ratios). Replacing them with ASCII makes those
    # comments harder to read; the false-positive cost outweighs any
    # actual confusion risk.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests can use private members of modules they're testing. Tests
# also frequently set up scenario state with assignments that aren't
# used in the assertion (a ratio computed for clarity, an unpacked
# return where only one element is checked) — that's documentary
# value, not dead code.
"tests/*" = ["F401", "F811", "F841", "RUF046", "RUF059"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# pytest-cov is opt-in (`pytest --cov`). Default `pytest` stays fast.
# Branch coverage is on by default — the kind of bug we miss without
# branch coverage (e.g. a never-taken `else` clause) is exactly the
# kind worth catching as the codebase grows.
[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "diag_*.py",
    "backtest.py",
]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
