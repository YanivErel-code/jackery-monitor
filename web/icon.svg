<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0b0d10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- Soft halo -->
  <circle cx="256" cy="256" r="220" fill="url(#halo)"/>
  <!-- Lightning bolt — generous strokes, gradient fill -->
  <path d="M286 84 L138 282 L228 282 L198 432 L370 224 L268 224 L304 84 Z"
        fill="url(#glow)"/>
  <!-- Subtle inner stroke around the bolt for crispness -->
  <path d="M286 84 L138 282 L228 282 L198 432 L370 224 L268 224 L304 84 Z"
        fill="none" stroke="#0b0d10" stroke-width="6" stroke-linejoin="round" opacity="0.18"/>
</svg>
