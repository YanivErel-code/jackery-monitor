# Default deployment — Synology / generic Linux. Two always-on services, no
# compose profiles (Container Manager's UI doesn't expose --profile).
#
# Synology Container Manager:
#   Project > Create
#     Project name: jackery-monitor
#     Path:         /docker/jackery-monitor
#     Source:       Use existing docker-compose.yml   (this file is picked up automatically)
#
# Any Linux box from the CLI:
#   docker compose up -d --build
#
# For macOS development (host bridge) or mock telemetry, see docker-compose.dev.yml.

services:
  # Cloud bridge — holds Jackery credentials, polls the Jackery cloud,
  # exposes JSON-RPC on TCP 8766 (internal docker network only, NOT to the LAN).
  jackery-bridge:
    build: .
    image: jackery-monitor:latest
    container_name: jackery-bridge
    restart: unless-stopped
    command: ["python", "bridge.py"]
    environment:
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: "8766"
      CLOUD_POLL_INTERVAL_S: "15"
      # Leave JACKERY_EMAIL/JACKERY_PASSWORD blank in .env to use the UI sign-in flow
      # (credentials encrypted to /data). Set them only to pin via env (CI etc).
      JACKERY_EMAIL: "${JACKERY_EMAIL:-}"
      JACKERY_PASSWORD: "${JACKERY_PASSWORD:-}"
      JACKERY_REGION: "${JACKERY_REGION:-US}"
      JACKERY_CREDS_FILE: /data/jackery-creds.json
    expose:
      - "8766"
    volumes:
      - jackery-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8766)); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # FastAPI dashboard — talks to the bridge over the internal docker network.
  # Published on the LAN at http://<nas-ip>:${JACKERY_HTTP_PORT}.
  jackery-monitor:
    build: .
    image: jackery-monitor:latest
    container_name: jackery-monitor
    restart: unless-stopped
    depends_on:
      jackery-bridge:
        condition: service_healthy
    ports:
      - "${JACKERY_HTTP_PORT:-8000}:8000"
    environment:
      BACKEND: bridge
      BRIDGE_URL: jackery-bridge:8766
      POLL_INTERVAL_S: "10"
      JACKERY_DB: /data/energy.db
    volumes:
      - jackery-data:/data
      # Live-bind the web UI so editing files in /docker/jackery-monitor/web/
      # takes effect immediately (just hard-reload the browser, no rebuild).
      # Comment this out if you want the image to be self-contained.
      - ./web:/app/web

volumes:
  jackery-data:
